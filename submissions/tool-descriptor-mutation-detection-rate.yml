usage_details: |
  Applies to any client, proxy or guard that pins a tool definition on first
  sight and compares later listings against the pin. It separates "pinning is
  enabled" from "the pin covers the field an attacker would change": when a
  digest is built from a subset of the definition, a flip in a field outside
  that subset produces exactly the same output as a clean session.

  Interpretation is per field, not per score. An implementation at 5/6 that
  misses `annotations` is materially weaker than one at 5/6 that misses
  `_meta`, because a `destructiveHint` flip changes a client's own approval
  decision. Use the named undetected fields to decide; use the rate only to
  compare runs over the same F.

known_failure_modes: |
  - The score depends entirely on which fields are in F. A narrow F inflates
    it. F and its source must be published with the number.
  - It measures detection, not prevention or response. A client that detects
    every mutation and forwards the call anyway still scores 1.0.
  - Without the required control the metric is trivially gameable: flag every
    re-listing and score 1.0 on any F.
  - One mutation per field is a floor, not a survey. A field can be partly
    covered, for example a digest over a serialised object that is sensitive to
    one key within it and not another.
  - It says nothing about tool behaviour, only about the advertised definition.

references:
  - >-
    Yue Jia and Mark Harman, "An Analysis and Survey of the Development of
    Mutation Testing", IEEE Transactions on Software Engineering 37(5),
    649-678, 2011. https://doi.org/10.1109/TSE.2010.62 — the mutation-score
    method this metric applies to tool definitions rather than to program
    source.
  - >-
    Model Context Protocol specification, version 2025-06-18, Server Features /
    Tools, Data Types.
    https://modelcontextprotocol.io/specification/2025-06-18/server/tools —
    defines the tool definition being mutated, and states the trust assumption
    the metric tests: "For trust & safety and security, clients MUST consider
    tool annotations to be untrusted unless they come from trusted servers."

implementation_resources:
  - >-
    coproduct-opensource/nucleus, crates/nucleus-mcp-guard/src/proxy.rs at
    merge commit a7a2b0925e24b969f820e333c9e1028c5630b0fa (MIT). The
    single-field mutation check and its required control, as executed tests:
    `a_flipped_destructive_hint_is_blocked_and_taints` (proxy.rs:595) and
    `an_unchanged_annotated_listing_stays_clean` (proxy.rs:622); a second pair
    at proxy.rs:533 and proxy.rs:553. The hashed triple is built at
    proxy.rs:112-131, with the envelope field list at proxy.rs:125. This code
    carries the single-field check and its control, not the sweep over F that
    produces the rate: at this commit only `description` and
    `annotations.destructiveHint` have executed mutation tests, and nothing in
    the crate computes detected/applied. The rate is derived by the operator
    from the per-field results.
    https://github.com/coproduct-opensource/nucleus/blob/a7a2b0925e24b969f820e333c9e1028c5630b0fa/crates/nucleus-mcp-guard/src/proxy.rs
  - >-
    Model Context Protocol schema, version 2025-06-18, definitions.Tool — the
    machine-readable field list that fixes F for MCP clients.
    https://github.com/modelcontextprotocol/modelcontextprotocol/blob/2025-06-18/schema/2025-06-18/schema.json

computational_requirements: >-
  Negligible. One `tools/list` round trip per mutated field plus one for the
  control; no model inference, no GPU.

usage_rights: >-
  No restrictions on the metric definition. The cited implementation
  (coproduct-opensource/nucleus) is MIT-licensed.
